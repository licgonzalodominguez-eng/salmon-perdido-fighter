<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="theme-color" content="#0a0d16" />
<title>En Busca del Salmón Perdido — Arcade</title>
<style>
  :root{
    --bg:#0a0d16; --panel:#121826; --ink:#eef2ff; --muted:#8b95b8; --accent:#3b7dff;
    --p1:#4aa3ff; --p2:#ff5470;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;min-height:100%}
  .wrap{width:min(96vw,960px)}
  .frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 1px #1e2a48,0 40px 90px -40px #000;background:#05070d;touch-action:none}
  canvas{width:100%;height:100%;display:block;image-rendering:auto;touch-action:none}
  .hint{width:min(96vw,960px);color:var(--muted);font-size:12px;line-height:1.6;text-align:center;letter-spacing:.03em}
  .hint b{color:var(--ink)}
  .tag{color:var(--muted);font-size:13px;letter-spacing:.14em;text-transform:uppercase}

  /* ---------- teléfono ---------- */
  #touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:5}
  #touch button{
    pointer-events:auto;position:absolute;width:58px;height:58px;border-radius:50%;
    border:2px solid rgba(255,255,255,.28);background:rgba(18,24,38,.42);
    color:#eef2ff;font:700 19px ui-monospace,monospace;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);
  }
  #touch button:active{background:rgba(74,163,255,.55);border-color:#fff}
  #touch .pad{position:absolute;left:12px;bottom:12px;width:190px;height:190px}
  #touch .acts{position:absolute;right:12px;bottom:12px;width:190px;height:190px}
  #touch [data-k=up]{left:66px;bottom:128px}
  #touch [data-k=left]{left:4px;bottom:66px}
  #touch [data-k=down]{left:66px;bottom:4px}
  #touch [data-k=right]{left:128px;bottom:66px}
  #touch [data-k=punch]{right:66px;bottom:128px}
  #touch [data-k=kick]{right:4px;bottom:66px}
  #touch [data-k=block]{right:128px;bottom:66px}
  #touch [data-k=special]{right:66px;bottom:4px;border-color:#4ad6ff;color:#4ad6ff}
  .rotate{position:absolute;left:0;right:0;top:0;z-index:6;display:none;
    text-align:center;padding:6px 10px;background:rgba(6,9,16,.75);color:var(--ink);
    font-size:13px;pointer-events:none}

  /* modo teléfono: ocupa toda la pantalla, sin depender de unidades nuevas */
  body.touch{padding:0;gap:0;position:fixed;top:0;left:0;right:0;bottom:0;
    overflow:hidden;overscroll-behavior:none;display:block}
  body.touch .tag, body.touch .hint{display:none}
  body.touch .wrap{position:absolute;inset:0;width:100%;height:100%}
  body.touch .frame{position:absolute;inset:0;width:100%;height:100%;border-radius:0;aspect-ratio:auto}
  body.touch #touch{display:block}
  body.touch canvas{width:100%;height:100%;object-fit:contain}
  @media (orientation:portrait){ body.touch .rotate{display:block} }

  #touchToggle{position:fixed;right:8px;top:8px;z-index:20;width:34px;height:34px;
    border-radius:8px;border:1px solid #ffffff30;background:rgba(18,24,38,.6);color:#eef2ff;
    font-size:16px;line-height:1;cursor:pointer}
  body.touch #touchToggle{background:rgba(74,163,255,.5);border-color:#fff}
</style>
</head>
<body>
  <div class="tag">En Busca del Salmón Perdido</div>
  <div class="wrap">
    <div class="frame">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="touch" aria-hidden="true">
        <div class="pad">
          <button data-k="up" aria-label="saltar">▲</button>
          <button data-k="left" aria-label="izquierda">◀</button>
          <button data-k="down" aria-label="agacharse">▼</button>
          <button data-k="right" aria-label="derecha">▶</button>
        </div>
        <div class="acts">
          <button data-k="punch" aria-label="golpe">P</button>
          <button data-k="kick" aria-label="patada">K</button>
          <button data-k="block" aria-label="bloquear">B</button>
          <button data-k="special" aria-label="especial">★</button>
        </div>
      </div>
      <div class="rotate">Girá el teléfono para jugar ↺</div>
    </div>
  </div>
  <button id="touchToggle" title="Controles en pantalla">📱</button>
  <div class="hint">
    Controles por defecto — <b>P1</b>: A/D · W · S · F golpe · G patada · V bloquear · B especial &nbsp;|&nbsp;
    <b>P2</b>: ←/→ · ↑ · ↓ · 1 · 2 · 3 · 4<br>
    Enter confirmar · M silenciar · P pausa · R reiniciar &nbsp;·&nbsp; <b>se pueden cambiar en el menú → CONTROLES</b>
  </div>

<script>
(() => {
"use strict";

/* ============================================================ SETUP */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = 960, H = 540, GROUND = 476;
const MINX = 72, MAXX = 888;

const DPR = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);

/* ============================================================ AUDIO */
let actx = null, muted = false;
function tone(freq, dur, type = "square", vol = 0.05, slideTo = null) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    const t = actx.currentTime;
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.value = vol; g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  swing: () => tone(180 + Math.random() * 40, 0.06, "sawtooth", 0.03),
  hit:   () => { tone(140, 0.09, "square", 0.06, 60); tone(320, 0.05, "triangle", 0.04); },
  heavy: () => { tone(90, 0.16, "sawtooth", 0.08, 40); },
  block: () => tone(500, 0.05, "square", 0.04, 700),
  jump:  () => tone(320, 0.09, "sine", 0.03, 520),
  fire:  () => tone(420, 0.18, "triangle", 0.05, 180),
  ko:    () => { tone(200, 0.3, "sawtooth", 0.09, 70); setTimeout(() => tone(110, 0.4, "sawtooth", 0.08, 50), 160); },
  ui:    () => tone(440, 0.05, "square", 0.03),
  round: () => { tone(523, 0.1, "square", 0.05); setTimeout(() => tone(784, 0.16, "square", 0.05), 110); },
  whip:  () => { tone(240, 0.04, "sawtooth", 0.05, 1400); tone(90, 0.12, "square", 0.05, 40); },
  heal:  () => { tone(523, 0.12, "sine", 0.04, 784); setTimeout(() => tone(659, 0.18, "sine", 0.03, 988), 90); },
  cast(shape) {
    switch (shape) {
      case "bolt":     tone(1300, 0.05, "square", 0.045, 380); tone(760, 0.09, "sawtooth", 0.03, 180); break;
      case "runebolt": tone(150, 0.28, "sine", 0.05, 85); tone(620, 0.14, "triangle", 0.03, 300); break;
      case "knife":    tone(680, 0.06, "sawtooth", 0.035, 1500); break;
      case "shuriken": tone(1700, 0.04, "square", 0.03, 2500); tone(950, 0.11, "triangle", 0.02, 1700); break;
      case "orb":      tone(140, 0.30, "sine", 0.06, 68); tone(300, 0.16, "sine", 0.03, 170); break;
      case "om":       tone(180, 0.55, "sine", 0.06, 176); tone(270, 0.55, "sine", 0.03, 264); break;
      case "katana":   tone(2100, 0.05, "square", 0.03, 3100); tone(1400, 0.20, "triangle", 0.025, 780); break;
      case "energy":   tone(520, 0.18, "sine", 0.05, 170); tone(260, 0.12, "triangle", 0.03, 120); break;
      default:         tone(420, 0.18, "triangle", 0.05, 180);
    }
  },
};

/* ---- música de combate (procedural, estilo oscuro / Mortal Kombat) ---- */
const music = {
  on: false, master: null, drone: [], timer: null, step: 0, next: 0, bpm: 134,
  start() {
    if (this.on) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.resume) actx.resume();
    } catch (e) { return; }
    this.on = true; this.step = 0; this.next = actx.currentTime + 0.15;
    this.master = actx.createGain();
    this.master.gain.value = muted ? 0 : 0.10;
    this.master.connect(actx.destination);
    this.drone = [];
    for (const d of [0.5, 0.5031, 0.749]) {           // pad grave detuneado
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sawtooth"; o.frequency.value = 55 * d;
      g.gain.value = 0.02; o.connect(g); g.connect(this.master);
      o.start(); this.drone.push(o);
    }
    this.timer = setInterval(() => this.sched(), 25);
  },
  stop() {
    if (!this.on) return;
    this.on = false;
    clearInterval(this.timer); this.timer = null;
    try {
      const now = actx.currentTime;
      this.master.gain.setTargetAtTime(0.0001, now, 0.06);
      for (const o of this.drone) o.stop(now + 0.4);
      const m = this.master;
      setTimeout(() => { try { m.disconnect(); } catch (e) {} }, 500);
    } catch (e) {}
    this.drone = [];
  },
  setDuck(q) { try { if (this.master) this.master.gain.value = (muted || q) ? 0 : 0.10; } catch (e) {} },
  note(freq, t, dur, type, vol, slideTo) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  sched() {
    if (!this.on || !actx) return;
    const spb = 60 / this.bpm / 4;
    while (this.next < actx.currentTime + 0.12) {
      this.play(this.step, this.next);
      this.next += spb;
      this.step = (this.step + 1) % 32;
    }
  },
  play(s, t) {
    const R = 55;                                     // La menor, tono oscuro
    const b = s % 16, bar2 = s >= 16;
    if ([0, 3, 6, 8, 11, 14].includes(b)) this.note(95, t, 0.14, "sine", 0.6, 30);        // bombo
    if (b === 7 || b === 15) this.note(200, t, 0.16, "triangle", 0.32, 62);               // tom tribal
    if (b % 2 === 1) this.note(5000 + Math.random() * 500, t, 0.02, "square", 0.012);     // hat
    if (b % 2 === 0) {                                                                    // bajo
      const seq = [0, 0, 3, 0, 0, -2, 3, 5];
      const st = seq[(b / 2) | 0];
      const f = R * Math.pow(2, st / 12);
      this.note(f, t, 0.13, "sawtooth", 0.14, f * 0.985);
    }
    const lseq = { 0: 12, 6: 15, 10: 19 };                                                // lead ominoso
    if (b in lseq) {
      const semi = lseq[b] + (bar2 ? -2 : 0);
      this.note(R * Math.pow(2, semi / 12), t, b === 10 ? 0.24 : 0.14, "sawtooth", 0.05);
    }
    if (s === 28) {                                                                       // stab de tensión (tritono)
      this.note(R * 2, t, 0.32, "sawtooth", 0.05);
      this.note(R * 2 * Math.pow(2, 6 / 12), t, 0.32, "sawtooth", 0.04);
    }
  },
};

/* ============================================================ INPUT */
const keys = {}, pressed = {};
let captureCb = null;              // si está puesto, la próxima tecla se captura (remapeo)

const DEFAULT_MAP1 = { left:"KeyA", right:"KeyD", up:"KeyW", down:"KeyS", punch:"KeyF", kick:"KeyG", block:"KeyV", special:"KeyB" };
const DEFAULT_MAP2 = { left:"ArrowLeft", right:"ArrowRight", up:"ArrowUp", down:"ArrowDown", punch:"Digit1", kick:"Digit2", block:"Digit3", special:"Digit4" };
const MAP1 = { ...DEFAULT_MAP1 }, MAP2 = { ...DEFAULT_MAP2 };
const ACTIONS = [
  ["left","Izquierda"], ["right","Derecha"], ["up","Saltar"], ["down","Agacharse"],
  ["punch","Golpe"], ["kick","Patada"], ["block","Bloquear"], ["special","Especial"],
];
const CKEY = "sp-fighter-controls";
function loadControls() {
  try {
    const s = JSON.parse(localStorage.getItem(CKEY) || "{}");
    for (const k in DEFAULT_MAP1) MAP1[k] = (s.p1 && s.p1[k]) || DEFAULT_MAP1[k];
    for (const k in DEFAULT_MAP2) MAP2[k] = (s.p2 && s.p2[k]) || DEFAULT_MAP2[k];
  } catch (e) { Object.assign(MAP1, DEFAULT_MAP1); Object.assign(MAP2, DEFAULT_MAP2); }
}
function saveControls() {
  try { localStorage.setItem(CKEY, JSON.stringify({ p1: { ...MAP1 }, p2: { ...MAP2 } })); } catch (e) {}
}
function resetControls() { Object.assign(MAP1, DEFAULT_MAP1); Object.assign(MAP2, DEFAULT_MAP2); saveControls(); rebuildGamekeys(); }
function keyConflict(code) {
  let n = 0;
  for (const v of Object.values(MAP1)) if (v === code) n++;
  for (const v of Object.values(MAP2)) if (v === code) n++;
  return n > 1;
}
function keyLabel(code) {
  if (!code) return "—";
  const m = {
    ArrowLeft:"←", ArrowRight:"→", ArrowUp:"↑", ArrowDown:"↓",
    Space:"ESPACIO", Enter:"ENTER", Backspace:"⌫", Tab:"TAB", Escape:"ESC",
    ShiftLeft:"⇧ Izq", ShiftRight:"⇧ Der", ControlLeft:"Ctrl Izq", ControlRight:"Ctrl Der",
    AltLeft:"Alt Izq", AltRight:"Alt Der", Semicolon:"; ", Comma:", ", Period:". ", Slash:"/",
  };
  if (m[code]) return m[code];
  if (code.startsWith("Key")) return code.slice(3);
  if (code.startsWith("Digit")) return code.slice(5);
  if (code.startsWith("Numpad")) return "Num " + code.slice(6);
  return code;
}

let GAMEKEYS = new Set();
function rebuildGamekeys() {
  GAMEKEYS = new Set(["Enter","Space","KeyM","KeyP","KeyR","Escape",
    "KeyW","KeyS","ArrowUp","ArrowDown",
    ...Object.values(MAP1), ...Object.values(MAP2)]);
}
loadControls();
rebuildGamekeys();

addEventListener("keydown", (e) => {
  if (captureCb) {
    e.preventDefault();
    if (!e.repeat) { const cb = captureCb; captureCb = null; cb(e.code); }
    return;
  }
  if (GAMEKEYS.has(e.code)) e.preventDefault();
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
  if (e.code === "KeyM" && !e.repeat) { muted = !muted; music.setDuck(false); }
}, { passive: false });
addEventListener("keyup", (e) => { keys[e.code] = false; });

/* ---- controles táctiles (teléfono) ---- */
const TKEY = "sp-fighter-touch";
const autoTouch = (navigator.maxTouchPoints || navigator.msMaxTouchPoints || 0) > 0
  || ("ontouchstart" in window)
  || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
  || (Math.min(screen.width, screen.height) <= 820);
let forced = null;
try {
  if (/[?&#]touch/i.test(location.href)) forced = true;
  else { const v = localStorage.getItem(TKEY); if (v === "1") forced = true; if (v === "0") forced = false; }
} catch (e) {}
let IS_TOUCH = forced !== null ? forced : autoTouch;

function applyTouch(on) {
  IS_TOUCH = on;
  document.body.classList.toggle("touch", on);
  const tg = document.getElementById("touchToggle");
  if (tg) tg.textContent = on ? "🖥️" : "📱";
  try { localStorage.setItem(TKEY, on ? "1" : "0"); } catch (e) {}
}
{
  const tg = document.getElementById("touchToggle");
  if (tg) tg.addEventListener("click", () => applyTouch(!document.body.classList.contains("touch")));
}
applyTouch(IS_TOUCH);

{
  document.body.classList.toggle("touch", IS_TOUCH);
  const held = {};
  const setBtn = (act, on) => {
    const code = MAP1[act];
    if (on) { keys[code] = true; if (!held[act]) pressed[code] = true; held[act] = true; }
    else { keys[code] = false; held[act] = false; }
  };
  for (const b of document.querySelectorAll("#touch button")) {
    const act = b.dataset.k;
    const down = (e) => { e.preventDefault(); setBtn(act, true); };
    const up = (e) => { e.preventDefault(); setBtn(act, false); };
    // se enganchan pointer + touch + mouse; el guard `held` evita dobles
    b.addEventListener("pointerdown", down, { passive: false });
    b.addEventListener("pointerup", up, { passive: false });
    b.addEventListener("pointercancel", up, { passive: false });
    b.addEventListener("touchstart", down, { passive: false });
    b.addEventListener("touchend", up, { passive: false });
    b.addEventListener("touchcancel", up, { passive: false });
    b.addEventListener("mousedown", down);
    b.addEventListener("mouseup", up);
  }
  // red de seguridad: tocar la pantalla (fuera de los botones) confirma en los menús
  const tapMenu = () => {
    if (["title", "versus", "roundend", "matchend"].includes(game.scene)) pressed["Enter"] = true;
  };
  cv.addEventListener("pointerdown", tapMenu);
  cv.addEventListener("touchstart", tapMenu, { passive: true });
  const frame = document.querySelector(".frame");
  frame.addEventListener("touchmove", (e) => { if (document.body.classList.contains("touch")) e.preventDefault(); }, { passive: false });
  addEventListener("contextmenu", (e) => { if (document.body.classList.contains("touch")) e.preventDefault(); });
}

function readInput(map) {
  return {
    left: !!keys[map.left], right: !!keys[map.right], up: !!keys[map.up], down: !!keys[map.down],
    block: !!keys[map.block],
    punch: !!pressed[map.punch], kick: !!pressed[map.kick], special: !!pressed[map.special],
  };
}
const anyConfirm = () => pressed["Enter"] || pressed["Space"] || pressed[MAP1.punch] || pressed[MAP2.punch] || pressed["KeyF"] || pressed["Digit1"];

/* ============================================================ ROSTER */
const ROSTER = [
  { id:"michiloco", name:"Michiloco", tag:"Villano Redimido",
    col:{fur:"#f1eee6", fur2:"#dcd6ea", accent:"#4a3d7a", trim:"#e8c24a", eyeL:"#4aa3ff", eyeR:"#f2b33a", nose:"#e59bb0"},
    stats:{hp:100, spd:1.00, pow:1.00, wt:1.00, jump:1.00},
    art:{ears:"cat", hat:"none", cape:"purpleTorn", body:"normal", fang:true},
    sp:{name:"Bola de Energía", kind:"projectile", shape:"energy", pcolor:"#8f7fff", speed:470, r:16, dmg:11, cost:38} },
  { id:"lupita", name:"Lupita", tag:"Princesa Hechicera",
    col:{fur:"#fbf6ee", fur2:"#efe5d4", accent:"#c8237a", trim:"#e8c24a", eye:"#8a5bd0", nose:"#e89bb5"},
    stats:{hp:100, spd:0.86, pow:0.98, wt:0.95, jump:0.96},
    art:{ears:"cat", hat:"crownMagenta", cape:"magenta", body:"gown", staff:"orbMagenta"},
    sp:{name:"Rayo del Báculo", kind:"projectile", shape:"bolt", pcolor:"#ffe36b", speed:560, r:11, dmg:10, cost:40} },
  { id:"bruce", name:"Bruce", tag:"Gato Aventurero",
    col:{fur:"#2c2c31", fur2:"#41414a", accent:"#7a4a24", trim:"#c0392b", eye:"#f2c14e", nose:"#c98a86"},
    stats:{hp:100, spd:1.00, pow:1.06, wt:1.05, jump:1.00},
    art:{ears:"cat", hat:"fedora", cape:"none", body:"normal", scarf:true, rope:true},
    sp:{name:"Latigazo", kind:"rope", cost:40} },
  { id:"kai", name:"Kai", tag:"Guerrero Ninja",
    col:{fur:"#e8843c", fur2:"#f0b070", accent:"#211f24", trim:"#e8a83c", eye:"#7ad06a", nose:"#d98a6a"},
    stats:{hp:100, spd:1.20, pow:0.94, wt:0.90, jump:1.06},
    art:{ears:"cat", hat:"headband", cape:"none", body:"normal", katana:true, scar:true},
    sp:{name:"Katana Voladora", kind:"projectile", shape:"katana", pcolor:"#e6ecf5", speed:520, r:15, dmg:12, boomerang:true, cost:38} },
  { id:"atlas", name:"Atlas", tag:"Guardián del Laberinto",
    col:{fur:"#f2a9c0", fur2:"#f8c8d7", accent:"#8a97a3", trim:"#3fd6e0", eye:"#e2a23c", nose:"#d98aa5"},
    stats:{hp:122, spd:0.74, pow:1.26, wt:1.38, jump:0.84},
    art:{ears:"axolotl", hat:"none", cape:"none", body:"big", backpack:true, key:true, runes:true},
    sp:{name:"Rayo del Mazo", kind:"projectile", shape:"runebolt", pcolor:"#3fd6e0", speed:440, r:18, dmg:14, cost:40} },
  { id:"nocturna", name:"Nocturna", tag:"Reina de las Sombras",
    col:{fur:"#1d1b26", fur2:"#332f40", accent:"#6a3db0", trim:"#c9a44c", eye:"#b57bf0", nose:"#7a5a8a"},
    stats:{hp:100, spd:0.92, pow:1.00, wt:1.00, jump:1.00},
    art:{ears:"cat", hat:"crownObsidian", cape:"gownPurple", body:"gown", staff:"orbPurple", streak:true},
    sp:{name:"Orbe de Sombra", kind:"projectile", shape:"orb", pcolor:"#b57bf0", speed:360, r:18, dmg:12, cost:42} },
  { id:"viper", name:"Viper", tag:"Serpiente Sigilosa",
    col:{fur:"#4a5f3a", fur2:"#c9a44c", accent:"#1f392b", trim:"#c9a44c", eye:"#f2d24e", nose:"#2f2f2f"},
    stats:{hp:98, spd:1.16, pow:0.95, wt:0.88, jump:0.95},
    art:{ears:"snake", hat:"none", cape:"none", body:"coil", dagger:true},

const byId = (id) => ROSTER.find((r) => r.id === id);

/* ============================================================ TUNING */
const G = 1550;
const WALK = 176, DASH = 640, JUMPV = 580;
const ROUND_TIME = 99, WINS_NEEDED = 2;
const METER_MAX = 100;

const ATK = {
  light:   { startup:0.07, active:0.05, recovery:0.15, dmg:6,  stun:0.30, block:0.20, chip:1, kb:130, pop:0,    reach:[24,66],  hy:-62, h:22 },
  heavy:   { startup:0.15, active:0.07, recovery:0.30, dmg:11, stun:0.44, block:0.28, chip:2, kb:250, pop:-70,  reach:[20,80],  hy:-50, h:28 },
  clow:    { startup:0.12, active:0.07, recovery:0.30, dmg:9,  stun:0.40, block:0.28, chip:2, kb:180, pop:0,    reach:[18,74],  hy:-22, h:22, low:true },
  air:     { startup:0.06, active:0.16, recovery:0.10, dmg:9,  stun:0.34, block:0.22, chip:2, kb:190, pop:0,    reach:[6,54],   hy:-40, h:34, overhead:true },
  dash:    { startup:0.10, active:0.20, recovery:0.30, dmg:13, stun:0.52, block:0.30, chip:2, kb:330, pop:-150, reach:[-24,44], hy:-72, h:74 },
  grab:    { startup:0.10, active:0.06, recovery:0.38, dmg:17, stun:0.55, kb:360, pop:-360, reach:[6,46], hy:-64, h:64, grab:true },
  rope:    { startup:0.13, active:0.16, recovery:0.32, dmg:10, stun:0.50, block:0.30, chip:2, kb:60,  pop:0,   reach:[10,220], hy:-58, h:16, rope:true },
  riposte: { startup:0.05, active:0.10, recovery:0.26, dmg:15, stun:0.6,  block:0.3,  chip:0, kb:300, pop:-120, reach:[10,72], hy:-58, h:44 },
};
const HITSTOP = { light:0.045, heavy:0.075, dash:0.08, grab:0.09, rope:0.05, riposte:0.09, projectile:0.06 };

/* ============================================================ FIGHTER */
function bodyScale(char) {
  return char.art.body === "big" ? 1.9 : char.art.body === "small" ? 1.42 : 1.62;
}
class Fighter {
  constructor(char, x, facing, isCPU) {
    this.char = char;
    this.x = x; this.y = GROUND;
    this.vx = 0; this.vy = 0;
    this.facing = facing;
    this.maxhp = char.stats.hp;
    this.hp = this.maxhp;
    this.ghost = this.maxhp;      // lagging health bar
    this.meter = 0;
    this.isCPU = isCPU;
    this.grounded = true;
    this.state = "idle";          // idle|walk|crouch|block|jump|hitstun|attack|special|ko|win
    this.st = 0;                  // time in state
    this.atk = null;
    this.crouching = false;
    this.blocking = false;
    this.stun = 0;
    this.invuln = 0;
    this.countering = false;
    this.spCooldown = 0;
    this.flash = 0;
    this.ko = false;
    this.win = false;
    this.ai = { t: 0, mode: "idle", punch:false, kick:false, special:false };
    this.facingLock = 0;
  }
  get scale() { return bodyScale(this.char); }
  get halfW() { return 22 * this.scale; }
  get topY() { return this.grounded ? (this.crouching ? -58 : -96) * this.scale : -90 * this.scale; }

  hurtbox() {
    const s = this.scale;
    if (this.crouching && this.grounded)
      return { x: this.x - 25 * s, y: this.y - 46 * s, w: 50 * s, h: 46 * s };
    if (!this.grounded)
      return { x: this.x - 20 * s, y: this.y - 92 * s, w: 40 * s, h: 84 * s };
    return { x: this.x - 22 * s, y: this.y - 96 * s, w: 44 * s, h: 96 * s };
  }

  activeHitbox() {
    const a = this.atk;
    if (!a) return null;
    const k = a.type;
    if (k === "projectile" || k === "counter") return null;
    if (a.t < a.def.startup || a.t > a.def.startup + a.def.active) return null;
    if (a.hasHit && !a.def.rope && this.char.sp.multi !== true) return null;
    if (a.type === "dash" && this.char.sp.multi && a.hitCount >= 2) return null;
    const d = a.def, f = this.facing, s = this.scale;
    let x0 = this.x + f * d.reach[0] * s;
    let x1 = this.x + f * d.reach[1] * s;
    const x = Math.min(x0, x1), w = Math.abs(x1 - x0);
    let hy = d.hy;
    if (a.type === "heavy" && a.crouch) { hy = -22; }
    const y = this.y + hy * s;
    return { x, y, w, h: d.h * s, def: d, type: a.type, low: !!d.low || !!a.lowFlag, overhead: !!d.overhead, grab: !!d.grab, rope: !!d.rope };
  }

  startAttack(type, opt = {}) {
    const def = ATK[type];
    this.atk = { type, def, t: 0, hasHit: false, hitCount: 0, nextHit: 0, crouch: !!opt.crouch, spawned: false, lowFlag: !!opt.low };
    this.state = (type === "riposte") ? "attack" : "attack";
    this.st = 0;
    if (type === "light") sfx.swing();
    else if (type === "heavy" || type === "air") sfx.swing();
  }

  startSpecial() {
    const sp = this.char.sp;
    this.meter -= sp.cost;
    this.spCooldown = 0.6;
    this.state = "special";
    this.st = 0;
    if (sp.kind === "dash") {
      this.atk = { type: "dash", def: ATK.dash, t: 0, hasHit: false, hitCount: 0, nextHit: 0, lowFlag: !!sp.low };
      if (sp.iframes) this.invuln = sp.short ? 0.22 : 0.34;
      sfx.swing();
    } else if (sp.kind === "projectile") {
      this.atk = { type: "projectile", def: { startup: 0.14, active: 0, recovery: 0.34 }, t: 0, spawned: false };
      sfx.cast(sp.shape);
    } else if (sp.kind === "rope") {
      this.atk = { type: "rope", def: ATK.rope, t: 0, hasHit: false, hitCount: 0 };
      sfx.whip();
    } else if (sp.kind === "grab") {
      this.atk = { type: "grab", def: ATK.grab, t: 0, hasHit: false };
      sfx.swing();
    } else if (sp.kind === "counter") {
      this.atk = { type: "counter", def: { startup: 0, active: 0.30, recovery: 0.30 }, t: 0 };
      this.countering = true;
    }
  }

  hurt(dmg, stun, kb, pop, fromX, kind) {
    this.hp = Math.max(0, this.hp - dmg);
    this.meter = Math.min(METER_MAX, this.meter + 7);
    this.stun = stun;
    this.state = "hitstun";
    this.st = 0;
    this.atk = null;
    this.countering = false;
    this.blocking = false;
    const dir = this.x < fromX ? -1 : 1;
    this.vx = dir * kb / this.char.stats.wt;
    if (pop && this.grounded) { this.vy = pop; this.grounded = false; }
    else if (!this.grounded && pop) this.vy = Math.min(this.vy, pop * 0.6);
    this.flash = 0.12;
    if (kind === "heavy" || kind === "dash" || kind === "grab" || kind === "riposte") sfx.heavy();
    sfx.hit();
  }

  blockHit(chip, blockstun, kb, fromX) {
    this.hp = Math.max(0, this.hp - chip);
    this.meter = Math.min(METER_MAX, this.meter + 4);
    this.stun = blockstun;
    this.state = "hitstun";
    this.st = 0;
    this.blocking = true;
    const dir = this.x < fromX ? -1 : 1;
    this.vx = dir * kb * 0.5;
    this.flash = 0.06;
    sfx.block();
  }

  update(dt, opp, input) {
    this.st += dt;
    this.flash = Math.max(0, this.flash - dt);
    this.invuln = Math.max(0, this.invuln - dt);
    this.spCooldown = Math.max(0, this.spCooldown - dt);
    // ghost health easing
    if (this.ghost > this.hp) this.ghost = Math.max(this.hp, this.ghost - 60 * dt);
    else this.ghost = this.hp;

    if (this.ko) {
      this.vy += G * dt; this.x += this.vx * dt; this.y += this.vy * dt;
      if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.vx *= 0.7; }
      this.x = clamp(this.x, MINX, MAXX);
      return;
    }
    if (this.win) {
      if (this.y < GROUND) { this.vy += G * dt; this.y += this.vy * dt; if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; } }
      return;
    }

    // face opponent when neutral (con giro animado)
    if (["idle", "walk", "crouch", "block"].includes(this.state) && this.grounded) {
      const nf = opp.x >= this.x ? 1 : -1;
      if (nf !== this.facing) { this.facing = nf; this.turnT = 0.14; }
    }
    this.turnT = Math.max(0, (this.turnT || 0) - dt);
    this.landT = Math.max(0, (this.landT || 0) - dt);

    if (this.state === "hitstun") {
      this.stun -= dt;
      this.vx *= this.grounded ? Math.pow(0.02, dt) : Math.pow(0.5, dt);
      if (!this.grounded) this.vy += G * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.grounded = true; }
      if (this.stun <= 0 && this.grounded) { this.state = "idle"; this.st = 0; this.blocking = false; }
      this.x = clamp(this.x, MINX, MAXX);
      return;
    }

    const attacking = this.state === "attack" || this.state === "special";

    // ----- attack phase progression -----
    if (attacking && this.atk) {
      const a = this.atk;
      a.t += dt;
      // dash lunge
      if (a.type === "dash") {
        if (a.t >= a.def.startup && a.t <= a.def.startup + a.def.active) {
          this.vx = this.facing * DASH * (this.char.sp.short ? 0.8 : 1);
        } else this.vx *= Math.pow(0.01, dt);
        if (this.char.sp.multi) { a.nextHit -= dt; }
      } else if (a.type === "projectile") {
        if (!a.spawned && a.t >= a.def.startup) {
          a.spawned = true;
          spawnProjectile(this);
        }
        this.vx *= Math.pow(0.01, dt);
      } else if (a.type === "counter") {
        this.countering = a.t < a.def.active;
        this.vx = 0;
      } else {
        this.vx *= Math.pow(0.01, dt);
      }
      const total = a.def.startup + a.def.active + a.def.recovery;
      if (a.t >= total) {
        this.atk = null;
        this.countering = false;
        this.state = "idle";
        this.st = 0;
      }
      // physics for airborne attacks
      if (!this.grounded) {
        this.vy += G * dt;
        this.y += this.vy * dt;
        this.x += this.vx * dt;
        if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.grounded = true; }
      } else {
        this.x += this.vx * dt;
      }
      this.x = clamp(this.x, MINX, MAXX);
      return;
    }

    // ----- neutral: read input -----
    this.blocking = input.block && this.grounded;
    this.crouching = input.down && this.grounded && !this.blocking;

    if (this.grounded) {
      if (!this.blocking && !this.crouching) {
        const mv = (input.right ? 1 : 0) - (input.left ? 1 : 0);
        this.vx = mv * WALK * this.char.stats.spd;
        this.state = mv !== 0 ? "walk" : "idle";
        if (mv !== 0) {                          // polvo en cada paso
          this.walkT = (this.walkT || 0) + dt;
          const step = Math.floor(this.walkT * 4.1);
          if (step !== this._step) { this._step = step; spawnDust(this.x - mv * 12 * this.scale, GROUND, 2); }
        } else this.walkT = 0;
      } else {
        this.vx *= Math.pow(0.01, dt);
        this.state = this.blocking ? "block" : "crouch";
      }
      if (input.up && !this.crouching && !this.blocking) {
        this.vy = -JUMPV * this.char.stats.jump;
        this.grounded = false;
        this.state = "jump";
        sfx.jump();
      }
      // attacks
      if (input.punch) this.startAttack("light");
      else if (input.kick) this.startAttack(this.crouching ? "heavy" : "heavy", { crouch: this.crouching });
      else if (input.special && this.meter >= this.char.sp.cost && this.spCooldown <= 0) this.startSpecial();
    } else {
      // air
      this.vy += G * dt;
      this.state = "jump";
      const mv = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      if (mv !== 0) this.vx = clamp(this.vx + mv * 600 * dt, -WALK * this.char.stats.spd, WALK * this.char.stats.spd);
      if ((input.punch || input.kick) && !this.atk) this.startAttack("air");
    }

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (this.y >= GROUND) {
      this.y = GROUND;
      if (!this.grounded) {
        this.grounded = true;
        this.landT = Math.min(0.18, 0.06 + Math.abs(this.vy) / 4000);   // aterrizaje: squash
        if (["jump"].includes(this.state)) this.state = "idle";
        spawnDust(this.x, GROUND, 5);
      }
      this.vy = 0;
    }
    this.x = clamp(this.x, MINX, MAXX);
  }
}

/* ============================================================ PROJECTILES / FX */
let projectiles = [], particles = [];
function spawnProjectile(f) {
  const s = f.char.sp;
  const x = f.x + f.facing * (40 + 20 * f.scale), y = f.y - 68 * f.scale;   // sale por delante del cuerpo
  const col = s.pcolor || "#ffd24a";
  projectiles.push({
    x, y,
    vx: f.facing * (s.speed || 430), face: f.facing,
    r: s.r || 15, owner: f, life: 2.6, spin: 0,
    color: col,
    shape: s.shape || (s.salmon ? "salmon" : s.crescent ? "orb" : "orb"),
    drain: s.drain || 0,
    boomerang: !!s.boomerang, bt: 0,
    dmg: Math.round((s.dmg || 9) * f.char.stats.pow), stun: 0.5,
  });
  spawnSpark(x, y, col, 14);
  particles.push({ x, y, r0: 6, life: 0.22, max: 0.22, kind: "ring", color: col });   // fogonazo
  game.shake = Math.max(game.shake, 3);
}
function spawnDust(x, y, n) {
  for (let i = 0; i < n; i++)
    particles.push({ x, y, vx: (Math.random() - .5) * 90, vy: -Math.random() * 60, life: .3, max: .3, kind: "dust" });
}
function spawnSpark(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .28, max: .28, kind: "spark", color });
  }
}
function spawnBlockSpark(x, y) {
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 1.6, sp = 100 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .22, max: .22, kind: "spark", color: "#bcd4ff" });
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "dust") p.vy += 120 * dt;
    if (p.kind === "spark") p.vy += 260 * dt;
  }
  particles = particles.filter((p) => p.life > 0);
}

/* ============================================================ GAME STATE */
const game = {
  scene: "title",           // title|controls|select|versus|fight|roundend|matchend
  mode: 2,                  // 1 or 2 players
  menuSel: 0,
  ctrlCursor: 0,            // fila seleccionada en la pantalla de controles
  ctrlCapturing: false,     // esperando que el jugador pulse una tecla
  // select
  selPick: 0,               // in 1P: 0 -> choose P1, 1 -> choose opponent
  cur1: 0, cur2: 4,
  lock1: false, lock2: false,
  pick1: null, pick2: null,
  // fight
  f1: null, f2: null,
  stage: null,
  round: 1, wins: [0, 0],
  timer: ROUND_TIME,
  roundState: "intro",      // intro|go|play|ko|done
  announce: "", annTimer: 0,
  shake: 0, hitstop: 0, slowmo: 0,
  paused: false,
  sceneT: 0,
};
const STAGES = ["dojo", "laberinto", "luna", "templo", "mercado"];

function startMatch() {
  game.scene = "versus";
  game.sceneT = 0;
  game.round = 1; game.wins = [0, 0];
  game.stage = STAGES[(Math.random() * STAGES.length) | 0];
}
function beginRound() {
  const c1 = byId(game.pick1), c2 = byId(game.pick2);
  game.f1 = new Fighter(c1, 300, 1, game.mode === 1 ? false : false);
  game.f2 = new Fighter(c2, 660, -1, game.mode === 1 ? true : false);
  // carry a little meter between rounds
  game.f1.meter = game.round > 1 ? 30 : 0;
  game.f2.meter = game.round > 1 ? 30 : 0;
  game.timer = ROUND_TIME;
  game.roundState = "intro";
  game.announce = "ROUND " + game.round; game.annTimer = 1.1;
  game.scene = "fight";
  projectiles = []; particles = [];
  sfx.round();
  music.start();
}
function endRound(winner) {
  game.roundState = "done";
  if (winner === 1) game.wins[0]++;
  else if (winner === 2) game.wins[1]++;
  game.announce = winner === 0 ? "EMPATE" : (winner === 1 ? "GANA " + shortName(game.pick1) : "GANA " + shortName(game.pick2));
  game.annTimer = 1.6;
  game.scene = "roundend";
  game.sceneT = 0;
}
function shortName(id) { return byId(id).name.toUpperCase(); }

/* ============================================================ HIT RESOLUTION */
function overlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function tryHit(attacker, victim) {
  if (victim.invuln > 0 || victim.ko) return;
  const hb = attacker.activeHitbox();
  if (!hb) return;
  const vb = victim.hurtbox();
  if (!overlap(hb, vb)) return;

  const d = hb.def;
  const multi = attacker.atk && attacker.char.sp.multi && attacker.atk.type === "dash";
  if (multi) {
    if (attacker.atk.nextHit > 0) return;
    attacker.atk.hitCount++;
    attacker.atk.nextHit = 0.14;
    if (attacker.atk.hitCount >= 2) attacker.atk.hasHit = true;
  } else {
    attacker.atk.hasHit = true;
  }

  // grabs: whiff on airborne / ignore block, no counter stop
  if (hb.grab) {
    if (!victim.grounded) return;
    applyHit(attacker, victim, d, "grab", false);
    return;
  }

  // counter check
  if (victim.countering && hb.type !== "projectile") {
    victim.countering = false;
    victim.atk = null;
    victim.state = "idle";
    game.hitstop = 0.12; game.shake = 8;
    spawnSpark(victim.x, victim.y - 60, "#ffe08a", 14);
    // riposte
    victim.facing = attacker.x >= victim.x ? 1 : -1;
    victim.startAttack("riposte");
    // cancel attacker's move
    attacker.atk = null;
    attacker.state = "idle";
    return;
  }

  // block check
  const blocking = victim.blocking && victim.state !== "hitstun" &&
    ((attacker.x >= victim.x && victim.facing === 1) || (attacker.x < victim.x && victim.facing === -1) || true);
  let canBlock = victim.blocking && victim.grounded;
  if (hb.low && !victim.crouching) canBlock = false;
  if (hb.overhead && victim.crouching) canBlock = false;

  if (canBlock) {
    victim.blockHit(d.chip || 0, d.block || 0.2, d.kb, attacker.x);
    attacker.vx = -attacker.facing * 90;
    spawnBlockSpark((victim.x + attacker.x) / 2, victim.y - 56);
    attacker.meter = Math.min(METER_MAX, attacker.meter + 4);
    game.hitstop = 0.04;
    return;
  }

  applyHit(attacker, victim, d, hb.type, hb.rope);
}
function applyHit(attacker, victim, d, kind, isRope) {
  const dmg = Math.max(1, Math.round(d.dmg * attacker.char.stats.pow));
  victim.hurt(dmg, d.stun, d.kb, d.pop, attacker.x, kind);
  attacker.meter = Math.min(METER_MAX, attacker.meter + 9);
  if (isRope && dist(attacker, victim) > 80) {
    victim.x = attacker.x + attacker.facing * 74;
    victim.vx = 0;
  }
  const cx = (attacker.x + victim.x) / 2, cy = victim.y - 58;
  spawnSpark(cx, cy, kind === "heavy" || kind === "dash" || kind === "grab" ? "#ffd24a" : "#fff2c4",
    kind === "light" ? 8 : 14);
  game.hitstop = HITSTOP[kind] || 0.05;
  game.shake = kind === "light" ? 4 : kind === "heavy" ? 9 : 11;
}
function dist(a, b) { return Math.abs(a.x - b.x); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* ============================================================ AI */
function aiInput(f, opp) {
  const a = f.ai;
  a.t -= 1 / 60;
  const gap = dist(f, opp);
  const inp = { left: false, right: false, up: false, down: false, block: false, punch: false, kick: false, special: false };

  // react to projectiles
  const incoming = projectiles.find((p) => p.owner !== f && Math.sign(p.vx) === Math.sign(f.x - p.x) && Math.abs(p.x - f.x) < 300);
  if (incoming && Math.abs(incoming.x - f.x) < 150 && Math.random() < 0.5) {
    const r = Math.random();
    a.mode = r < 0.5 ? "duck" : r < 0.8 ? "jump" : "block"; a.t = 0.35;
  }

  if (a.t <= 0) {
    a.t = 0.16 + Math.random() * 0.3;
    const r = Math.random();
    if (gap > 300) a.mode = r < 0.25 && f.char.sp.kind === "projectile" && f.meter >= f.char.sp.cost ? "special"
      : r < 0.75 ? "approach" : "dash";
    else if (gap > 150) a.mode = r < 0.30 ? "approach" : r < 0.5 ? "jumpin" : r < 0.7 ? "special" : "poke";
    else a.mode = r < 0.34 ? "attack" : r < 0.5 ? "block" : r < 0.66 ? "special" : r < 0.82 ? "attack" : "retreat";
    a.punch = a.kick = a.special = false;
  }

  const toward = opp.x > f.x ? "right" : "left";
  const away = toward === "right" ? "left" : "right";

  switch (a.mode) {
    case "approach": inp[toward] = true; break;
    case "retreat": inp[away] = gap < 220; break;
    case "dash":
      if (f.char.sp.kind === "dash" && f.meter >= f.char.sp.cost && f.spCooldown <= 0) { inp.special = !a.special; a.special = true; }
      else inp[toward] = true;
      break;
    case "jump": inp.up = true; a.mode = "approach"; break;
    case "duck": inp.down = true; if (Math.random() < 0.04) a.mode = "approach"; break;
    case "jumpin":
      inp[toward] = true;
      if (f.grounded && Math.random() < 0.4) inp.up = true;
      if (!f.grounded && gap < 120) { inp.kick = !a.kick; a.kick = true; }
      break;
    case "block": inp.block = true; if (Math.random() < 0.02) a.mode = "attack"; break;
    case "poke":
      inp[toward] = gap > 90;
      if (gap < 96 && f.grounded) { inp.kick = !a.kick; a.kick = true; }
      break;
    case "attack":
      if (gap < 92 && f.grounded) {
        if (Math.random() < 0.5) { inp.punch = !a.punch; a.punch = true; }
        else { inp.kick = !a.kick; a.kick = true; }
      } else inp[toward] = true;
      break;
    case "special":
      if (f.meter >= f.char.sp.cost && f.spCooldown <= 0 && f.grounded) {
        const kind = f.char.sp.kind;
        const ok = kind === "projectile" ? gap > 140
          : kind === "grab" ? gap < 90
          : kind === "counter" ? gap < 130
          : gap < 240;
        if (ok) { inp.special = !a.special; a.special = true; }
        else inp[toward] = true;
      } else inp[toward] = true;
      break;
    default: break;
  }
  // don't walk off stage / keep facing sane
  if (f.x <= MINX + 8) inp.left = false;
  if (f.x >= MAXX - 8) inp.right = false;
  return inp;
}

/* ============================================================ UPDATE */
function update(dt) {
  game.sceneT += dt;
  if (game.scene === "title") return updateTitle();
  if (game.scene === "controls") return updateControls();
  if (game.scene === "select") return updateSelect();
  if (game.scene === "versus") {
    if (game.sceneT > 1.6 || anyConfirm()) beginRound();
    return;
  }
  if (game.scene === "roundend") {
    game.annTimer -= dt;
    updateParticles(dt);
    if (game.sceneT > 1.9) {
      if (game.wins[0] >= WINS_NEEDED || game.wins[1] >= WINS_NEEDED || game.round >= 5) {
        game.scene = "matchend"; game.sceneT = 0;
        music.stop();
        const w = game.wins[0] === game.wins[1] ? 0 : (game.wins[0] > game.wins[1] ? 1 : 2);
        game.matchWinner = w;
      } else {
        game.round++;
        beginRound();
      }
    }
    return;
  }
  if (game.scene === "matchend") {
    if (game.sceneT > 0.6 && anyConfirm()) { game.scene = "select"; resetSelect(); }
    return;
  }

  // ---------- FIGHT ----------
  if (pressed["KeyP"]) { game.paused = !game.paused; music.setDuck(game.paused); }
  if (game.paused) return;
  if (pressed["KeyR"] && game.roundState === "play") { beginRound(); return; }

  const f1 = game.f1, f2 = game.f2;
  game.annTimer -= dt;

  if (game.roundState === "intro") {
    if (game.annTimer <= 0) { game.roundState = "go"; game.announce = "¡PELEA!"; game.annTimer = 0.7; }
  } else if (game.roundState === "go") {
    if (game.annTimer <= 0) { game.roundState = "play"; game.announce = ""; }
  }

  const simulate = game.roundState === "play" || game.roundState === "go" ? game.roundState === "play" : false;

  // hitstop freeze
  if (game.hitstop > 0) { game.hitstop -= dt; }
  const canSim = game.roundState === "play" && game.hitstop <= 0;

  let sdt = dt;
  if (game.roundState === "ko") sdt = dt * 0.35; // slow-mo

  if (game.roundState === "play" && game.hitstop <= 0) {
    const in1 = game.mode === 1 ? (f1.isCPU ? aiInput(f1, f2) : readInput(MAP1)) : readInput(MAP1);
    const in2 = game.mode === 1 ? aiInput(f2, f1) : readInput(MAP2);
    f1.update(sdt, f2, in1);
    f2.update(sdt, f1, in2);

    // push apart
    const a = f1.hurtbox(), b = f2.hurtbox();
    if (a.x < b.x + b.w && a.x + a.w > b.x && f1.grounded && f2.grounded) {
      const ov = Math.min(a.x + a.w - b.x, b.x + b.w - a.x);
      if (f1.x < f2.x) { f1.x -= ov / 2; f2.x += ov / 2; }
      else { f1.x += ov / 2; f2.x -= ov / 2; }
      f1.x = clamp(f1.x, MINX, MAXX); f2.x = clamp(f2.x, MINX, MAXX);
    }

    tryHit(f1, f2);
    tryHit(f2, f1);

    // projectiles
    for (const p of projectiles) {
      if (p.boomerang) {                          // katana de Kai: va y vuelve
        p.bt += sdt;
        if (p.bt < 0.5) p.vx = p.face * (520 - p.bt * 700);
        else {
          const toOwner = Math.sign(p.owner.x - p.x) || -p.face;
          p.vx = Math.max(-820, Math.min(820, p.vx + toOwner * 2200 * sdt));
          if (Math.abs(p.owner.x - p.x) < 48) p.life = 0;   // volvió a la mano
        }
      }
      p.x += p.vx * sdt; p.life -= sdt; p.spin += sdt * 20;
      const target = p.owner === f1 ? f2 : f1;
      if (target.invuln <= 0 && !target.ko) {
        const tb = target.hurtbox();
        if (p.x > tb.x && p.x < tb.x + tb.w && p.y > tb.y && p.y < tb.y + tb.h) {
          let canBlock = target.blocking && target.grounded;
          if (canBlock) { target.blockHit(2, 0.26, 120, p.x); spawnBlockSpark(p.x, p.y); }
          else {
            target.hurt(p.dmg, p.stun, 220, -40, p.x, "projectile");
            spawnSpark(p.x, p.y, p.color, 14);
            game.shake = 8; game.hitstop = 0.05;
            p.owner.meter = Math.min(METER_MAX, p.owner.meter + 8);
            if (p.drain) {                       // Ohm de Yubari: roba vida
              const heal = Math.round(p.dmg * p.drain);
              p.owner.hp = Math.min(p.owner.maxhp, p.owner.hp + heal);
              sfx.heal();
              for (let i = 0; i < 6; i++) particles.push({
                x: p.owner.x + (Math.random() - .5) * 30, y: p.owner.y - 40 - Math.random() * 50,
                vx: (Math.random() - .5) * 30, vy: -40 - Math.random() * 40,
                life: .5, max: .5, kind: "spark", color: "#7ee0a8",
              });
            }
          }
          p.life = 0;
        }
      }
    }
    projectiles = projectiles.filter((p) => p.life > 0 && p.x > -140 && p.x < W + 140);

    updateParticles(sdt);

    // timer
    game.timer -= dt;
    if (game.timer <= 0) {
      game.timer = 0;
      resolveKO(timeoutWinner());
    }
    // KO check
    if (f1.hp <= 0 || f2.hp <= 0) {
      const w = f1.hp <= 0 && f2.hp <= 0 ? 0 : (f2.hp <= 0 ? 1 : 2);
      resolveKO(w);
    }
  } else if (game.roundState === "ko") {
    f1.update(sdt, f2, ZEROIN);
    f2.update(sdt, f1, ZEROIN);
    updateParticles(sdt);
    game.annTimer -= dt;
    if (game.annTimer <= 0) endRound(game.pendingWinner);
  }

  game.shake *= Math.pow(0.02, dt);
}
const ZEROIN = { left:0,right:0,up:0,down:0,block:0,punch:0,kick:0,special:0 };

function timeoutWinner() {
  const r1 = game.f1.hp / game.f1.maxhp, r2 = game.f2.hp / game.f2.maxhp;
  if (Math.abs(r1 - r2) < 0.02) return 0;
  return r1 > r2 ? 1 : 2;
}
function resolveKO(winner) {
  if (game.roundState !== "play") return;
  game.roundState = "ko";
  game.pendingWinner = winner;
  game.announce = winner === 0 ? "DOBLE K.O." : "K.O.";
  game.annTimer = 1.7;
  game.shake = 16;
  music.stop();
  sfx.ko();
  const f1 = game.f1, f2 = game.f2;
  if (winner !== 1 && f1.hp <= 0) { f1.ko = true; f1.state = "ko"; f1.vy = -260; f1.vx = -f1.facing * 120; }
  if (winner !== 2 && f2.hp <= 0) { f2.ko = true; f2.state = "ko"; f2.vy = -260; f2.vx = -f2.facing * 120; }
  if (winner === 1) { f1.win = true; f1.state = "win"; }
  if (winner === 2) { f2.win = true; f2.state = "win"; }
  if (winner === 1 && f2.hp > 0) { f2.ko = true; f2.state = "ko"; f2.vy = -220; }
  if (winner === 2 && f1.hp > 0) { f1.ko = true; f1.state = "ko"; f1.vy = -220; }
}

/* ---- title ---- */
// en teléfono se oculta "2 JUGADORES" (no hay controles para el 2º)
const MENU = IS_TOUCH
  ? [{ label: "1 JUGADOR  (vs CPU)", act: 1 }, { label: "CONTROLES", act: "controls" }]
  : [{ label: "1 JUGADOR  (vs CPU)", act: 1 }, { label: "2 JUGADORES", act: 2 }, { label: "CONTROLES", act: "controls" }];
function updateTitle() {
  music.stop();
  const n = MENU.length;
  if (pressed["KeyW"] || pressed["ArrowUp"] || pressed[MAP1.up]) { game.menuSel = (game.menuSel + n - 1) % n; sfx.ui(); }
  if (pressed["KeyS"] || pressed["ArrowDown"] || pressed[MAP1.down]) { game.menuSel = (game.menuSel + 1) % n; sfx.ui(); }
  if (anyConfirm()) {
    sfx.round();
    const act = MENU[game.menuSel].act;
    if (act === "controls") { game.scene = "controls"; game.ctrlCursor = 0; game.ctrlCapturing = false; return; }
    game.mode = act;
    resetSelect();
    game.scene = "select";
  }
}

/* ---- controles ---- */
function ctrlRows() {
  const rows = [];
  for (const [a, label] of ACTIONS) rows.push({ p: 1, a, label });
  for (const [a, label] of ACTIONS) rows.push({ p: 2, a, label });
  rows.push({ kind: "reset" }, { kind: "back" });
  return rows;
}
function updateControls() {
  const rows = ctrlRows();
  if (game.ctrlCapturing) return;   // la tecla la resuelve captureCb
  if (pressed["KeyW"] || pressed["ArrowUp"]) { game.ctrlCursor = (game.ctrlCursor + rows.length - 1) % rows.length; sfx.ui(); }
  if (pressed["KeyS"] || pressed["ArrowDown"]) { game.ctrlCursor = (game.ctrlCursor + 1) % rows.length; sfx.ui(); }
  if (pressed["Escape"] || pressed["Backspace"]) { game.scene = "title"; return; }
  const confirm = pressed["Enter"] || pressed["Space"] || pressed[MAP1.punch] || pressed[MAP2.punch] || pressed["KeyF"] || pressed["Digit1"];
  if (!confirm) return;
  const row = rows[game.ctrlCursor];
  if (row.kind === "back") { sfx.ui(); game.scene = "title"; return; }
  if (row.kind === "reset") { resetControls(); sfx.round(); return; }
  // capturar tecla para esta acción
  game.ctrlCapturing = true;
  sfx.ui();
  captureCb = (code) => {
    game.ctrlCapturing = false;
    if (code === "Escape") return;
    (row.p === 1 ? MAP1 : MAP2)[row.a] = code;
    saveControls();
    rebuildGamekeys();
    sfx.round();
  };
}
function resetSelect() {
  game.selPick = 0;
  game.lock1 = game.lock2 = false;
  game.pick1 = game.pick2 = null;
  game.cur1 = 0; game.cur2 = 4;
}

/* ---- select ---- */
function moveCur(cur, dx, dy) {
  let c = cur % 3, r = (cur / 3) | 0;
  c = clamp(c + dx, 0, 2); r = clamp(r + dy, 0, 2);
  return r * 3 + c;
}
function updateSelect() {
  // Player 1 controls (always active)
  if (!game.lock1) {
    if (pressed[MAP1.left]) { game.cur1 = moveCur(game.cur1, -1, 0); sfx.ui(); }
    if (pressed[MAP1.right]) { game.cur1 = moveCur(game.cur1, 1, 0); sfx.ui(); }
    if (pressed[MAP1.up]) { game.cur1 = moveCur(game.cur1, 0, -1); sfx.ui(); }
    if (pressed[MAP1.down]) { game.cur1 = moveCur(game.cur1, 0, 1); sfx.ui(); }
    if (pressed[MAP1.punch] || pressed["Enter"]) {
      sfx.round();
      if (game.mode === 1) {
        if (game.selPick === 0) { game.pick1 = ROSTER[game.cur1].id; game.selPick = 1; game.cur1 = (game.cur1 + 1) % 9; }
        else { game.pick2 = ROSTER[game.cur1].id; startMatch(); }
      } else {
        game.pick1 = ROSTER[game.cur1].id; game.lock1 = true;
      }
    }
  }
  if (game.mode === 2 && !game.lock2) {
    if (pressed[MAP2.left]) { game.cur2 = moveCur(game.cur2, -1, 0); sfx.ui(); }
    if (pressed[MAP2.right]) { game.cur2 = moveCur(game.cur2, 1, 0); sfx.ui(); }
    if (pressed[MAP2.up]) { game.cur2 = moveCur(game.cur2, 0, -1); sfx.ui(); }
    if (pressed[MAP2.down]) { game.cur2 = moveCur(game.cur2, 0, 1); sfx.ui(); }
    if (pressed[MAP2.punch]) { game.pick2 = ROSTER[game.cur2].id; game.lock2 = true; sfx.round(); }
  }
  if (game.mode === 2 && game.lock1 && game.lock2) startMatch();
  if (pressed["Enter"] && game.scene === "select" && game.mode === 2 && game.lock1 && !game.lock2) {
    // allow single-key start vs CPU if P2 idle: press Enter after P1 lock -> P2 random CPU
  }
}

/* ============================================================ RENDER */
function frame(ts) {
  const now = ts / 1000;
  let dt = now - (frame.last || now);
  frame.last = now;
  dt = Math.min(dt, 1 / 30);

  update(dt);
  render();

  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(frame);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  if (game.scene === "title") return drawTitle();
  if (game.scene === "controls") return drawControls();
  if (game.scene === "select") return drawSelect();

  // shake
  ctx.save();
  if (game.shake > 0.4) ctx.translate((Math.random() - .5) * game.shake, (Math.random() - .5) * game.shake);

  drawStage(game.stage, game.sceneT);

  if (game.scene === "versus") { ctx.restore(); return drawVersus(); }

  // fighters (draw back one first by x)
  const f1 = game.f1, f2 = game.f2;
  const order = f1.y === f2.y ? [f1, f2] : (f1.y < f2.y ? [f1, f2] : [f2, f1]);
  for (const p of particles) if (p.kind === "dust") drawParticle(p);
  drawShadow(f1); drawShadow(f2);
  drawFighter(f1); drawFighter(f2);
  for (const pr of projectiles) drawProjectile(pr);
  for (const p of particles) if (p.kind === "spark" || p.kind === "ring") drawParticle(p);

  ctx.restore();

  drawHUD();
  if (game.announce) drawAnnounce(game.announce);
  if (game.scene === "roundend") drawRoundEnd();
  if (game.scene === "matchend") drawMatchEnd();
  if (game.paused) drawPause();
}

/* ---------- particles / shadow / projectile ---------- */
function drawParticle(p) {
  const a = clamp(p.life / p.max, 0, 1);
  if (p.kind === "ring") {                       // fogonazo del disparo
    const rr = p.r0 + (1 - a) * 34;
    ctx.strokeStyle = p.color; ctx.globalAlpha = a * 0.9; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.globalAlpha = a * 0.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r0 * a + 2, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (p.kind === "dust") {
    ctx.fillStyle = `rgba(200,205,225,${a * .5})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 * a + 1, 0, 7); ctx.fill();
  } else {
    ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function drawShadow(f) {
  const s = f.scale;
  const w = 46 * s * (f.grounded ? 1 : 0.6);
  ctx.fillStyle = "rgba(0,0,0,.32)";
  ctx.beginPath();
  ctx.ellipse(f.x, GROUND + 4, w, 9 * s, 0, 0, 7);
  ctx.fill();
}
function drawProjectile(p) {
  const dir = Math.sign(p.vx) || 1;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(dir, 1);
  ctx.shadowColor = p.color; ctx.shadowBlur = 16;

  if (p.shape === "bolt") {                     // rayo de Lupita: zigzag eléctrico
    const flick = 0.7 + 0.3 * Math.sin(p.spin * 6);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.globalAlpha = flick;
    ctx.beginPath();
    ctx.moveTo(-20, -6); ctx.lineTo(-6, 4); ctx.lineTo(2, -6); ctx.lineTo(16, 5);
    ctx.stroke();
    ctx.strokeStyle = p.color; ctx.lineWidth = 11; ctx.globalAlpha = flick * 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (p.shape === "runebolt") {          // rayo del mazo de Atlas
    ctx.strokeStyle = p.color; ctx.lineWidth = 4;
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = 0.5 - i * 0.12;
      ctx.beginPath(); ctx.moveTo(-22 - i * 8, 0); ctx.lineTo(6, (i - 1) * 3); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#eafcff";
    ctx.beginPath(); ctx.arc(0, 0, p.r * 0.55, 0, 7); ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill();
    ctx.fillStyle = "#eafcff"; ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
    ctx.fillText("ᛝ", 0, 4);
  } else if (p.shape === "knife") {             // cuchillo de Viper
    ctx.fillStyle = "#6b5230";
    ctx.fillRect(-16, -2, 9, 4);                // mango
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(16, 0); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(13, 0); ctx.stroke();
  } else if (p.shape === "shuriken") {          // shuriken de Ratín, girando
    ctx.rotate(p.spin * 4);
    ctx.fillStyle = p.color;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, -p.r); ctx.lineTo(4, -3); ctx.lineTo(-4, -3); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#2a2a30"; ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill();
  } else if (p.shape === "katana") {            // katana de Kai, revoleada
    ctx.strokeStyle = "rgba(220,230,245,.22)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.stroke();     // estela circular
    ctx.rotate(p.spin * 3.4);
    ctx.strokeStyle = p.color; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(34, 0); ctx.stroke();   // hoja
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(32, 0); ctx.stroke();    // filo
    ctx.fillStyle = "#d8a53a";
    ctx.fillRect(-16, -4, 4, 8);                                            // guarda (tsuba)
    ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-26, 0); ctx.stroke();  // mango
  } else if (p.shape === "energy") {            // bola de energía de Michiloco
    const pr = p.r * (1 + 0.12 * Math.sin(p.spin * 5));
    const g = ctx.createRadialGradient(0, 0, 1, 0, 0, pr * 1.5);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.35, "#d9d2ff");
    g.addColorStop(0.7, p.color); g.addColorStop(1, "rgba(143,127,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, pr * 1.5, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = p.spin * 3 + i * 2.1;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * pr * 0.9, Math.sin(a) * pr * 0.5, 2.2, 0, 7); ctx.stroke();
    }
  } else if (p.shape === "om") {                // Ohm vital de Yubari (roba vida)
    ctx.fillStyle = "rgba(232,194,74,.22)";
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.35, 0, 7); ctx.fill();
    ctx.strokeStyle = p.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, p.r * 1.15 + Math.sin(p.spin * 4) * 1.5, 0, 7); ctx.stroke();
    ctx.save();
    ctx.scale(dir, 1);                          // el glifo no se espeja
    ctx.fillStyle = p.color; ctx.textAlign = "center"; ctx.textBaseline = "middle";

/* ---------- stages ---------- */
function drawStage(id, t) {
  let sky1 = "#1a2340", sky2 = "#0c1120", floor = "#2a2036", edge = "#3b7dff";
  if (id === "dojo") { sky1 = "#3a2c22"; sky2 = "#20160f"; floor = "#5b3f28"; edge = "#c9a44c"; }
  if (id === "laberinto") { sky1 = "#0b2a44"; sky2 = "#04121f"; floor = "#0e2338"; edge = "#3fd6e0"; }
  if (id === "luna") { sky1 = "#241a3a"; sky2 = "#0c0918"; floor = "#1c1630"; edge = "#b57bf0"; }
  if (id === "templo") { sky1 = "#233a22"; sky2 = "#0d1a0d"; floor = "#2c3a24"; edge = "#7fbf5a"; }
  if (id === "mercado") { sky1 = "#5a3a2a"; sky2 = "#221410"; floor = "#4a3320"; edge = "#e8a83c"; }

  const g = ctx.createLinearGradient(0, 0, 0, H);

    ctx.fillStyle = sky1; ctx.beginPath(); ctx.arc(788, 108, 54, 0, 7); ctx.fill();

    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(120 + i * 210, 90); ctx.lineTo(120 + i * 210, GROUND); ctx.stroke(); }

    ctx.fillStyle = "#8a2b2b"; ctx.fillRect(430, 60, 100, 150);
    ctx.fillStyle = "#e8c24a"; ctx.font = "bold 30px monospace"; ctx.textAlign = "center";
    ctx.fillText("鮭", 480, 150);
  } else if (id === "templo") {
    ctx.fillStyle = "rgba(0,0,0,.25)";
    for (let i = 0; i < 6; i++) ctx.fillRect(40 + i * 165, 90, 90, GROUND - 90);
    ctx.fillStyle = "rgba(255,150,60,.5)";
    for (let i = 0; i < 4; i++) {

    }
  } else if (id === "mercado") {
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = ["#c0392b", "#2e7d5b", "#2a5b9e", "#c9a44c", "#8a3b7a"][i];
      ctx.fillRect(50 + i * 185, 210, 150, 60);

    }
    ctx.fillStyle = "rgba(255,220,150,.6)";
    for (let i = 0; i < 8; i++) { ctx.beginPath(); ctx.arc(70 + i * 120, 120 + Math.sin(t + i) * 6, 6, 0, 7); ctx.fill(); }
  }
  ctx.restore();

  // floor
  ctx.fillStyle = floor;
  ctx.fillRect(0, GROUND, W, H - GROUND);
  const fg = ctx.createLinearGradient(0, GROUND, 0, GROUND + 26);
  fg.addColorStop(0, "rgba(255,255,255,.16)"); fg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = fg; ctx.fillRect(0, GROUND, W, 26);
  ctx.strokeStyle = edge; ctx.globalAlpha = .5; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();

    ctx.fillStyle = c.nose;
    ctx.beginPath(); ctx.arc(-14, -12, 5, 0, 7); ctx.arc(14, -12, 5, 0, 7); ctx.fill();
  } else if (art.ears === "axolotl") {
    ctx.fillStyle = c.nose;
    for (let i = -1; i <= 1; i++) { tri(-14, -4 + i * 6, -30, -12 + i * 8, -14, 2 + i * 6); tri(14, -4 + i * 6, 30, -12 + i * 8, 14, 2 + i * 6); }
    ctx.fillStyle = c.fur;
  } else if (art.ears === "snake") {
    // hood
    ctx.fillStyle = c.fur;
    ctx.beginPath(); ctx.ellipse(0, -2, 20, 16, 0, 0, 7); ctx.fill();
  }
  // head shape
  ctx.fillStyle = c.fur;

    ctx.beginPath(); ctx.ellipse(4, 0, 17, 12, 0, 0, 7); ctx.fill();

  ctx.fillStyle = c.fur2;
  ctx.beginPath(); ctx.ellipse(6, 4, 9, 6, 0, 0, 7); ctx.fill();
  // streak (Nocturna)
  if (art.streak) { ctx.strokeStyle = "#d8d5e2"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-4, -14); ctx.lineTo(-2, -2); ctx.stroke(); }

    ctx.beginPath(); ctx.moveTo(-9, -8); ctx.lineTo(-1, -5);
    ctx.moveTo(13, -8); ctx.lineTo(5, -5); ctx.stroke();
  }
  // nose
  ctx.fillStyle = c.nose; ctx.beginPath(); ctx.arc(9, 3, 1.8, 0, 7); ctx.fill();
  // fang (Michiloco)

  // beard (Yubari)
  if (art.beard) { ctx.fillStyle = "#f2f0ea";
    ctx.beginPath(); ctx.moveTo(-8, 4); ctx.quadraticCurveTo(0, 26, 12, 6); ctx.quadraticCurveTo(6, 12, -8, 4); ctx.fill(); }
  // glasses (Yubari)
  if (art.glasses) { ctx.strokeStyle = "#c9b06a"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(-4, -2, 4, 0, 7); ctx.arc(8, -2, 4, 0, 7); ctx.moveTo(0, -2); ctx.lineTo(4, -2); ctx.stroke(); }

  // hats
  if (art.hat === "fedora") {
    ctx.fillStyle = c.accent;
    ctx.beginPath(); ctx.ellipse(0, -12, 20, 6, 0, 0, 7); ctx.fill();
    roundRect(-10, -24, 20, 14, 5); ctx.fill();
    ctx.fillStyle = "#5a3418"; ctx.fillRect(-10, -14, 20, 3);
  } else if (art.hat === "straw") {
    ctx.fillStyle = "#d9c27a";
    ctx.beginPath(); ctx.moveTo(-24, -8); ctx.lineTo(0, -28); ctx.lineTo(24, -8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#b89b52"; ctx.stroke();
  } else if (art.hat === "headband") {
    ctx.fillStyle = art.body === "small" ? "#1f1f24" : "#1f1f24";
    roundRect(-16, -10, 32, 6, 2); ctx.fill();
    ctx.fillStyle = c.trim; ctx.beginPath(); ctx.arc(0, -7, 2.6, 0, 7); ctx.fill();
    ctx.strokeStyle = "#1f1f24"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-16, -7); ctx.lineTo(-24, 2); ctx.moveTo(-16, -6); ctx.lineTo(-22, 8); ctx.stroke();
  } else if (art.hat === "crownMagenta") {
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.moveTo(-12, -12); ctx.lineTo(-12, -20); ctx.lineTo(-6, -14); ctx.lineTo(0, -24);
    ctx.lineTo(6, -14); ctx.lineTo(12, -20); ctx.lineTo(12, -12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c.trim; ctx.beginPath(); ctx.arc(0, -15, 2.4, 0, 7); ctx.fill();
  } else if (art.hat === "crownObsidian") {
    ctx.fillStyle = "#151320";
    ctx.beginPath();
    ctx.moveTo(-13, -10); ctx.lineTo(-9, -24); ctx.lineTo(-4, -13); ctx.lineTo(0, -28);
    ctx.lineTo(4, -13); ctx.lineTo(9, -24); ctx.lineTo(13, -10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = c.eye; ctx.beginPath(); ctx.arc(0, -16, 2.2, 0, 7); ctx.fill();
  }
  // tongue flick (snake)
  if (art.ears === "snake" && Math.sin(f.st * 8) > 0.7) {
    ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(16, 4); ctx.lineTo(24, 3); ctx.moveTo(24, 3); ctx.lineTo(27, 1); ctx.moveTo(24, 3); ctx.lineTo(27, 5); ctx.stroke();

  ctx.fillStyle = c.fur;

    ctx.save(); ctx.translate(hx, hy);

    ctx.strokeStyle = c.trim; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.stroke();

    ctx.strokeStyle = "#cfd6df"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-12, -70 * crouchK); ctx.lineTo(-2, -40); ctx.moveTo(-2, -70 * crouchK); ctx.lineTo(-12, -40); ctx.stroke();
  }
  if (art.staff) {
    ctx.strokeStyle = art.staff === "wood" ? "#8a5a34" : "#3a2f4a";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(hx, hy - 20); ctx.lineTo(hx, hy + 22); ctx.stroke();
    if (art.staff !== "wood") {

      ctx.shadowColor = orbCol; ctx.shadowBlur = 12;
      ctx.fillStyle = orbCol; ctx.beginPath(); ctx.arc(hx, hy - 22, 5, 0, 7); ctx.fill();

    ctx.save(); ctx.translate(hx, hy);
    ctx.rotate(f.state === "attack" || f.state === "special" ? -0.6 : 0.4);
    ctx.strokeStyle = "#dfe6ef"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14, -6); ctx.stroke();
    ctx.strokeStyle = c.trim; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(3, 0); ctx.stroke();
    ctx.restore();
  }
  if (art.key) {
    ctx.save(); ctx.translate(hx, hy);
    ctx.shadowColor = "#3fd6e0"; ctx.shadowBlur = 14; ctx.strokeStyle = "#7ff0f7"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(2, 0, 5, 0, 7); ctx.moveTo(6, 0); ctx.lineTo(22, 0); ctx.moveTo(18, 0); ctx.lineTo(18, 5); ctx.moveTo(22, 0); ctx.lineTo(22, 6); ctx.stroke();
    ctx.shadowBlur = 0; ctx.restore();

  if (f.state === "special" && f.atk && f.atk.type === "dash") {

function roundRect(x, y, w, h, r) {
  ctx.beginPath();

  ctx.arcTo(x + w, y + h, x, y + h, r);

}
function tri(x1, y1, x2, y2, x3, y3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
}

/* ---------- HUD ---------- */
function drawHUD() {
  const f1 = game.f1, f2 = game.f2;
  drawHealth(f1, 24, 22, false);
  drawHealth(f2, W - 24 - 380, 22, true);

  // timer
  ctx.fillStyle = "#0009"; roundRect(W / 2 - 34, 16, 68, 46, 8); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 30px monospace"; ctx.textAlign = "center";
  ctx.fillText(Math.ceil(game.timer), W / 2, 48);

  // round pips
  for (let i = 0; i < WINS_NEEDED; i++) {
    ctx.fillStyle = i < game.wins[0] ? "#ffd24a" : "#ffffff30";
    ctx.beginPath(); ctx.arc(W / 2 - 20 + i * 16, 74, 5, 0, 7); ctx.fill();
    ctx.fillStyle = i < game.wins[1] ? "#ffd24a" : "#ffffff30";
    ctx.beginPath(); ctx.arc(W / 2 + 20 - i * 16, 74, 5, 0, 7); ctx.fill();
  }

  // names
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "left"; ctx.fillStyle = "#eef2ff";
  ctx.fillText(f1.char.name.toUpperCase(), 26, 74);
  ctx.textAlign = "right";
  ctx.fillText(f2.char.name.toUpperCase(), W - 26, 74);
  ctx.textAlign = "left";

  if (muted) { ctx.fillStyle = "#8b95b8"; ctx.font = "12px monospace"; ctx.fillText("MUTE", W / 2 - 16, 96); }
}
function drawHealth(f, x, y, right) {
  const w = 380, h = 20;
  ctx.fillStyle = "#000a"; roundRect(x - 2, y - 2, w + 4, h + 4, 5); ctx.fill();
  // ghost
  const gp = f.ghost / f.maxhp;
  ctx.fillStyle = "#c94b5a";
  if (right) roundRect(x + w * (1 - gp), y, w * gp, h, 3); else roundRect(x, y, w * gp, h, 3);
  ctx.fill();
  // real
  const p = f.hp / f.maxhp;
  const col = p > 0.5 ? "#35e08b" : p > 0.22 ? "#e8c24a" : "#ff5470";
  ctx.fillStyle = col;
  if (right) roundRect(x + w * (1 - p), y, w * p, h, 3); else roundRect(x, y, w * p, h, 3);
  ctx.fill();
  ctx.strokeStyle = "#ffffff30"; ctx.lineWidth = 1; roundRect(x, y, w, h, 3); ctx.stroke();

  // meter
  const my = y + h + 4, mw = w * 0.8;
  ctx.fillStyle = "#0008"; roundRect(right ? x + w - mw : x, my, mw, 7, 3); ctx.fill();
  const mp = f.meter / METER_MAX;
  const ready = f.meter >= f.char.sp.cost;
  ctx.fillStyle = ready ? "#4ad6ff" : "#3a6a8a";
  roundRect(right ? x + w - mw * mp : x, my, mw * mp, 7, 3); ctx.fill();
  // special-ready star at the meter's inner edge
  if (ready) {
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 140);
    ctx.fillStyle = `rgba(74,214,255,${pulse})`;
    ctx.font = "bold 13px monospace";
    ctx.textAlign = right ? "left" : "right";
    ctx.fillText("★", right ? x + w - mw + 4 : x + mw - 4, my + 7);
    ctx.textAlign = "left";
  }
}

}

}

/* ---------- controles ---------- */
function drawControls() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#161d33"); g.addColorStop(1, "#080b14");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#eef2ff"; ctx.font = "bold 24px monospace";
  ctx.fillText("CONTROLES", W / 2, 46);
  ctx.fillStyle = "#8b95b8"; ctx.font = "12px monospace";
  ctx.fillText("↑/↓ mover · ENTER cambiar una tecla · ESC volver · se guarda solo", W / 2, 68);

  const rows = ctrlRows();
  const colX = [W * 0.10, W * 0.56];
  const top = 100, rh = 34;
  for (const pl of [1, 2]) {
    const x = colX[pl - 1];
    ctx.textAlign = "left";
    ctx.fillStyle = pl === 1 ? "#4aa3ff" : "#ff5470";
    ctx.font = "bold 15px monospace";
    ctx.fillText("JUGADOR " + pl, x, top - 10);
    for (let i = 0; i < ACTIONS.length; i++) {
      const idx = (pl - 1) * ACTIONS.length + i;
      const row = rows[idx];
      const y = top + i * rh;
      const selected = game.ctrlCursor === idx;
      if (selected) {
        ctx.fillStyle = "#ffffff14";
        roundRect(x - 8, y - 18, W * 0.36, 26, 6); ctx.fill();
      }
      ctx.fillStyle = selected ? "#eef2ff" : "#b9c2e0";
      ctx.font = "14px monospace";
      ctx.fillText(row.label, x, y);
      const code = (pl === 1 ? MAP1 : MAP2)[row.a];
      const cap = selected && game.ctrlCapturing;
      ctx.textAlign = "right";
      ctx.fillStyle = cap ? "#ffd24a" : keyConflict(code) ? "#ff5470" : "#7ee0a8";
      ctx.font = "bold 14px monospace";
      ctx.fillText(cap ? "pulsá una tecla…" : "[ " + keyLabel(code) + " ]", x + W * 0.34, y);
      ctx.textAlign = "left";
    }
  }

  // botones
  const btnY = top + ACTIONS.length * rh + 28;
  const btns = [["reset", "Restaurar por defecto"], ["back", "Volver"]];
  ctx.textAlign = "center";
  ctx.font = "bold 16px monospace";
  for (let i = 0; i < btns.length; i++) {
    const idx = ACTIONS.length * 2 + i;
    const sel = game.ctrlCursor === idx;
    ctx.fillStyle = sel ? "#4aa3ff" : "#cdd5f0";
    ctx.fillText((sel ? "▶  " : "") + btns[i][1], W / 2, btnY + i * 34);
  }

  if ([...Object.values(MAP1), ...Object.values(MAP2)].some(keyConflict)) {
    ctx.fillStyle = "#ff5470"; ctx.font = "12px monospace";
    ctx.fillText("una tecla en rojo está repetida", W / 2, H - 20);
  }
  ctx.textAlign = "left";
}

/* ---------- select ---------- */
function drawSelect() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#161d33"); g.addColorStop(1, "#080b14");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center"; ctx.fillStyle = "#eef2ff"; ctx.font = "bold 22px monospace";
  let title = "ELIGE LUCHADOR";
  if (game.mode === 1) title = game.selPick === 0 ? "JUGADOR 1 — ELIGE TU LUCHADOR" : "ELIGE AL RIVAL";
  ctx.fillText(title, W / 2, 40);

  const gx = W / 2 - 3 * 96 / 1 + 0; // compute grid
  const cell = 118, gw = cell * 3, ox = (W - gw) / 2, oy = 70;
  for (let i = 0; i < 9; i++) {
    const cxp = ox + (i % 3) * cell, cyp = oy + ((i / 3) | 0) * cell;
    ctx.fillStyle = "#0e1424"; roundRect(cxp + 4, cyp + 4, cell - 8, cell - 8, 10); ctx.fill();
    // mini fighter
    ctx.save();
    ctx.beginPath(); roundRect(cxp + 4, cyp + 4, cell - 8, cell - 8, 10); ctx.clip();
    ctx.translate(cxp + cell / 2, cyp + cell - 14);
    ctx.scale(0.42, 0.42);
    drawFighter(puppet(ROSTER[i], 1, game.sceneT + i));
    ctx.restore();
    // name
    ctx.fillStyle = "#cdd5f0"; ctx.font = "10px monospace"; ctx.textAlign = "center";
    ctx.fillText(ROSTER[i].name.toUpperCase(), cxp + cell / 2, cyp + cell - 6);

    // cursors
    if (!game.lock1 && game.cur1 === i) cursorBox(cxp, cyp, cell, "#4aa3ff", "P1");
    if (game.mode === 2 && !game.lock2 && game.cur2 === i) cursorBox(cxp, cyp, cell, "#ff5470", "P2", true);
    if (game.pick1 === ROSTER[i].id) cursorBox(cxp, cyp, cell, "#4aa3ff", "P1 ✓");
    if (game.pick2 === ROSTER[i].id) cursorBox(cxp, cyp, cell, "#ff5470", "P2 ✓", true);
  }

  // info panel for current pick(s)
  const info = ROSTER[game.mode === 2 ? game.cur1 : game.cur1];
  ctx.textAlign = "center"; ctx.fillStyle = "#8b95b8"; ctx.font = "13px monospace";
  ctx.fillText(info.tag + "  ·  ESPECIAL: " + info.sp.name, W / 2, oy + 3 * cell + 26);
  const st = info.stats;
  ctx.fillText(`VID ${st.hp}   VEL ${st.spd.toFixed(2)}   FUE ${st.pow.toFixed(2)}   PESO ${st.wt.toFixed(2)}`,
    W / 2, oy + 3 * cell + 46);

  ctx.fillStyle = "#6b7699"; ctx.font = "12px monospace";
  ctx.fillText(IS_TOUCH
    ? "movete con la cruceta · P para elegir"
    : game.mode === 2
      ? "P1 mueve con A/D/W/S y confirma con F   ·   P2 con flechas y 1"
      : "mueve con A/D/W/S · confirma con F/ENTER", W / 2, H - 20);
  ctx.textAlign = "left";
}
function cursorBox(x, y, cell, color, label, bottom) {
  ctx.strokeStyle = color; ctx.lineWidth = 3;
  roundRect(x + 3, y + 3, cell - 6, cell - 6, 10); ctx.stroke();
  ctx.fillStyle = color; ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
  ctx.fillText(label, x + cell / 2, bottom ? y + cell + 2 : y + 2);
}

/* ---------- versus splash ---------- */
function drawVersus() {
  ctx.fillStyle = "#000a"; ctx.fillRect(0, 0, W, H);
  const c1 = byId(game.pick1), c2 = byId(game.pick2);
  drawBigBust(c1, W * 0.28, GROUND - 10, 1, game.sceneT);
  drawBigBust(c2, W * 0.72, GROUND - 10, -1, game.sceneT + 3);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd24a"; ctx.font = "bold 70px monospace";
  ctx.strokeStyle = "#000"; ctx.lineWidth = 6;
  ctx.strokeText("VS", W / 2, H / 2); ctx.fillText("VS", W / 2, H / 2);
  ctx.fillStyle = "#eef2ff"; ctx.font = "bold 20px monospace";
  ctx.fillText(c1.name.toUpperCase(), W * 0.28, 70);
  ctx.fillText(c2.name.toUpperCase(), W * 0.72, 70);
  ctx.fillStyle = "#8b95b8"; ctx.font = "12px monospace";
  ctx.fillText(c1.tag, W * 0.28, 92);
  ctx.fillText(c2.tag, W * 0.72, 92);
  ctx.textAlign = "left";
}
function drawBigBust(char, x, y, facing, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1.05, 1.05);
  drawFighter(puppet(char, facing, t));
  ctx.restore();
}
function puppet(char, facing, t) {
  return {
    char, x: 0, y: 0, facing, state: "idle", st: t, vx: 0, vy: 0, grounded: true,
    crouching: false, blocking: false, flash: 0, invuln: 0, atk: null, ko: false, win: false, countering: false,
    scale: bodyScale(char),
  };
}

/* ============================================================ PWA (instalable si está en una web) */
(function pwa() {
  const ICON = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">' +
    '<rect width="512" height="512" rx="90" fill="#0a0d16"/>' +
    '<ellipse cx="286" cy="250" rx="150" ry="92" fill="#ff8bbf"/>' +
    '<path d="M150 250 L60 188 L60 312 Z" fill="#ff8bbf"/>' +
    '<circle cx="342" cy="230" r="15" fill="#fff"/>' +
    '<text x="256" y="460" font-family="monospace" font-size="86" font-weight="bold" fill="#ffd24a" text-anchor="middle">SP</text>' +
    "</svg>");
  const addLink = (rel, href) => { const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.appendChild(l); };
  addLink("icon", ICON);
  addLink("apple-touch-icon", ICON);
  const manifest = {
    name: "En Busca del Salmón Perdido — Arcade",
    short_name: "Salmón Fighter",
    start_url: location.href.split("#")[0],
    display: "standalone",
    orientation: "landscape",
    background_color: "#0a0d16",
    theme_color: "#0a0d16",
    icons: [
      { src: ICON, sizes: "192x192", type: "image/svg+xml" },
      { src: ICON, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" },
    ],
  };
  try {
    addLink("manifest", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)));
  } catch (e) {}
})();

/* ============================================================ GO */
requestAnimationFrame(frame);
})();
</script>
